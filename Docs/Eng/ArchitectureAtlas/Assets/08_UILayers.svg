<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title description">
  <title id="title">UI roles shown as layers of a game screen</title>
  <desc id="description">Global UI spans the application. Screen UI belongs to the current mode. HUD elements remain visible over gameplay, a Popup temporarily covers part of the screen, and a Widget is a small reusable UI element.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .muted { fill: #667085; }
      .panel { fill: #f8fafc; stroke: #d0d5dd; }
      .global { fill: #e9efff; stroke: #3159a7; }
      .screen { fill: #eef2f6; stroke: #667085; }
      .hud { fill: #ecfdf3; stroke: #079455; }
      .popup { fill: #f4f3ff; stroke: #6938ef; }
      .widget { fill: #fff7e8; stroke: #dc6803; }
      .line { fill: none; stroke: #667085; }
      @media (prefers-color-scheme: dark) {
        text { fill: #f2f4f7; }
        .muted { fill: #98a2b3; }
        .panel { fill: #182230; stroke: #475467; }
        .global { fill: #21386f; stroke: #84adff; }
        .screen { fill: #24303f; stroke: #98a2b3; }
        .hud { fill: #073d2a; stroke: #6ce9a6; }
        .popup { fill: #2f246b; stroke: #bdb4fe; }
        .widget { fill: #4e2d0a; stroke: #fec84b; }
        .line { stroke: #98a2b3; }
      }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="1060" height="680" rx="18"/>
  <text x="60" y="68" font-size="24" font-weight="500">UI roles on one game screen</text>
  <text class="muted" x="60" y="98" font-size="16">The roles may overlap visually and do not require matching physical folders</text>

  <g aria-label="Global UI frame">
    <rect class="global" x="60" y="130" width="730" height="500" rx="18" stroke-width="3"/>
    <text x="85" y="165" font-size="17" font-weight="600">Global UI — application lifetime</text>
    <text class="muted" x="765" y="165" text-anchor="end" font-size="13">fade · loading · notifications · debug</text>
  </g>

  <g aria-label="Screen UI">
    <rect class="screen" x="90" y="185" width="670" height="415" rx="14" stroke-width="2"/>
    <text x="115" y="218" font-size="17" font-weight="600">Screen UI — current Main or Overlay Phase</text>
    <path d="M115 540 L220 420 L315 480 L430 345 L535 445 L650 330 L735 420 L735 570 L115 570 Z" fill="#3159a7" fill-opacity=".09"/>
    <circle cx="615" cy="295" r="48" fill="#fdb022" fill-opacity=".25"/>
  </g>

  <g aria-label="HUD">
    <rect class="hud" x="115" y="245" width="245" height="58" rx="12" stroke-width="2"/>
    <text x="135" y="270" font-size="15" font-weight="600">HUD — health / energy</text>
    <rect x="135" y="280" width="170" height="8" rx="4" fill="#12b76a"/>

    <rect class="hud" x="565" y="245" width="170" height="95" rx="12" stroke-width="2"/>
    <text x="650" y="273" text-anchor="middle" font-size="15" font-weight="600">HUD — minimap</text>
    <circle cx="650" cy="307" r="21" fill="none" stroke="#079455" stroke-width="2"/>
    <path d="M650 287 L657 307 L650 302 L643 307 Z" fill="#079455"/>
  </g>

  <g aria-label="Popup">
    <rect x="90" y="185" width="670" height="415" rx="14" fill="#182230" fill-opacity=".14"/>
    <rect class="popup" x="270" y="330" width="320" height="170" rx="16" stroke-width="3"/>
    <text x="430" y="373" text-anchor="middle" font-size="19" font-weight="600">Popup</text>
    <text class="muted" x="430" y="401" text-anchor="middle" font-size="14">Temporary confirmation over the screen</text>
    <rect class="widget" x="320" y="438" width="95" height="38" rx="10" stroke-width="2"/>
    <text x="367" y="463" text-anchor="middle" font-size="14" font-weight="600">Cancel</text>
    <rect class="widget" x="445" y="438" width="95" height="38" rx="10" stroke-width="2"/>
    <text x="492" y="463" text-anchor="middle" font-size="14" font-weight="600">Confirm</text>
  </g>

  <g aria-label="Role labels">
    <path class="line" d="M790 165 C820 165, 812 180, 835 180" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="global" x="845" y="145" width="195" height="70" rx="12" stroke-width="2"/>
    <text x="865" y="175" font-size="16" font-weight="600">Global UI</text>
    <text class="muted" x="865" y="197" font-size="13">Persists across screens</text>

    <path class="line" d="M760 225 C810 225, 800 275, 835 275" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="screen" x="845" y="240" width="195" height="70" rx="12" stroke-width="2"/>
    <text x="865" y="270" font-size="16" font-weight="600">Screen UI</text>
    <text class="muted" x="865" y="292" font-size="13">Belongs to a game mode</text>

    <path class="line" d="M735 292 C800 292, 800 370, 835 370" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="hud" x="845" y="335" width="195" height="70" rx="12" stroke-width="2"/>
    <text x="865" y="365" font-size="16" font-weight="600">HUD</text>
    <text class="muted" x="865" y="387" font-size="13">Continuous gameplay info</text>

    <path class="line" d="M590 415 C760 415, 790 465, 835 465" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="popup" x="845" y="430" width="195" height="70" rx="12" stroke-width="2"/>
    <text x="865" y="460" font-size="16" font-weight="600">Popup</text>
    <text class="muted" x="865" y="482" font-size="13">Temporary overlay</text>

    <path class="line" d="M540 457 C750 520, 790 560, 835 560" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="widget" x="845" y="525" width="195" height="70" rx="12" stroke-width="2"/>
    <text x="865" y="555" font-size="16" font-weight="600">Widget</text>
    <text class="muted" x="865" y="577" font-size="13">Small reusable element</text>
  </g>

  <text class="muted" x="60" y="670" font-size="14">Example composition only: a Widget can be used inside a Screen, HUD, or Popup</text>
</svg>
