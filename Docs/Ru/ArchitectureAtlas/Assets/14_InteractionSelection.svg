<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title description">
  <title id="title">Область и приоритеты выбора интерактивной цели</title>
  <desc id="description">Вокруг InteractionOrigin задан радиус 2. В направлении последнего движения центральные 45 градусов имеют приоритет 0, две соседние полосы по 22.5 градуса имеют приоритет 1. Цели вне общего сектора 90 градусов отклоняются.</desc>
  <defs>
    <marker id="forward-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3159a7"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .muted { fill: #667085; }
      .panel { fill: #f8fafc; stroke: #d0d5dd; }
      .radius { fill: none; stroke: #98a2b3; }
      .boundary { fill: none; stroke: #667085; }
      .direct { fill: #12b76a; fill-opacity: .2; stroke: #079455; }
      .adjacent { fill: #f79009; fill-opacity: .18; stroke: #dc6803; }
      .player { fill: #e9efff; stroke: #3159a7; }
      .origin { fill: #3159a7; }
      .target-selected { fill: #12b76a; stroke: #067647; }
      .target-adjacent { fill: #f79009; stroke: #b54708; }
      .target-rejected { fill: #98a2b3; stroke: #475467; }
      .label-bg { fill: #ffffff; fill-opacity: .9; stroke: #e4e7ec; }
      @media (prefers-color-scheme: dark) {
        text { fill: #f2f4f7; }
        .muted { fill: #98a2b3; }
        .panel { fill: #182230; stroke: #475467; }
        .radius { stroke: #667085; }
        .boundary { stroke: #98a2b3; }
        .direct { fill: #32d583; fill-opacity: .2; stroke: #6ce9a6; }
        .adjacent { fill: #fdb022; fill-opacity: .18; stroke: #fec84b; }
        .player { fill: #21386f; stroke: #84adff; }
        .origin { fill: #84adff; }
        .target-selected { fill: #32d583; stroke: #6ce9a6; }
        .target-adjacent { fill: #fdb022; stroke: #fec84b; }
        .target-rejected { fill: #667085; stroke: #98a2b3; }
        .label-bg { fill: #182230; fill-opacity: .92; stroke: #475467; }
      }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="1060" height="680" rx="18"/>
  <text x="60" y="65" font-size="24" font-weight="500">Радиус + направление последнего движения</text>
  <text class="muted" x="60" y="95" font-size="16">Пример для направления вверх; те же области поворачиваются на одно из восьми направлений</text>

  <g aria-label="Область взаимодействия">
    <path class="radius" d="M70 590 A430 430 0 0 1 930 590" stroke-width="2" stroke-dasharray="9 9"/>

    <path class="adjacent" d="M500 590 L195.9 285.9 A430 430 0 0 1 335.5 192.7 Z" stroke-width="2"/>
    <path class="adjacent" d="M500 590 L664.5 192.7 A430 430 0 0 1 804.1 285.9 Z" stroke-width="2"/>
    <path class="direct" d="M500 590 L335.5 192.7 A430 430 0 0 1 664.5 192.7 Z" stroke-width="2"/>


    <line class="adjacent" x1="500" y1="590" x2="335.5" y2="192.7" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line class="adjacent" x1="500" y1="590" x2="664.5" y2="192.7" stroke-width="1.5" stroke-dasharray="6 6"/>


    <line x1="500" y1="565" x2="500" y2="132" stroke="#3159a7" stroke-width="4" marker-end="url(#forward-arrow)"/>
    <text x="518" y="145" font-size="16" font-weight="500">LastMoveDir → Direction8.Up</text>

    <rect class="player" x="466" y="542" width="68" height="96" rx="32" stroke-width="3"/>
    <circle class="origin" cx="500" cy="590" r="9"/>

    <rect class="label-bg" x="379" y="245" width="242" height="58" rx="12"/>
    <text x="500" y="270" text-anchor="middle" font-size="18" font-weight="500">Приоритет 0</text>
    <text class="muted" x="500" y="291" text-anchor="middle" font-size="14">центральные 45°</text>

    <rect class="label-bg" x="185" y="333" width="175" height="55" rx="12"/>
    <text x="272" y="357" text-anchor="middle" font-size="17" font-weight="500">Приоритет 1</text>
    <text class="muted" x="272" y="377" text-anchor="middle" font-size="14">22.5° слева</text>

    <rect class="label-bg" x="640" y="333" width="175" height="55" rx="12"/>
    <text x="727" y="357" text-anchor="middle" font-size="17" font-weight="500">Приоритет 1</text>
    <text class="muted" x="727" y="377" text-anchor="middle" font-size="14">22.5° справа</text>

    <text class="muted" x="255" y="249" font-size="14">−45°</text>
    <text class="muted" x="363" y="185" font-size="14">−22.5°</text>
    <text class="muted" x="625" y="185" font-size="14">+22.5°</text>
    <text class="muted" x="730" y="249" font-size="14">+45°</text>

    <line class="boundary" x1="500" y1="590" x2="915" y2="590" stroke-width="1.5"/>
    <text class="muted" x="830" y="577" font-size="14">радиус = 2</text>
  </g>

  <g aria-label="Пример кандидатов">
    <circle class="target-selected" cx="530" cy="375" r="18" stroke-width="3"/>
    <text x="555" y="370" font-size="15" font-weight="500">A — выбрана</text>
    <text class="muted" x="555" y="390" font-size="13">приоритет 0</text>

    <circle class="target-adjacent" cx="395" cy="455" r="18" stroke-width="3"/>
    <text x="270" y="450" font-size="15" font-weight="500">B — ближе</text>
    <text class="muted" x="270" y="470" font-size="13">но приоритет 1</text>

    <circle class="target-rejected" cx="900" cy="470" r="18" stroke-width="3"/>
    <text x="875" y="465" text-anchor="end" font-size="15" font-weight="500">C — отклонена</text>
    <text class="muted" x="875" y="485" text-anchor="end" font-size="13">вне общего сектора 90°</text>
  </g>

  <g aria-label="Легенда">
    <text x="80" y="677" font-size="14">A выигрывает у B: приоритет направления важнее расстояния</text>
  </g>
</svg>
